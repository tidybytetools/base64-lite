[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "base64-lite"
version = "1.0.0"
description = "Encode or decode Base64 for text and local files. URL-safe and data-URI options. Local CLI and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
]
keywords = ["base64", "encode", "decode", "data-uri", "url-safe", "cli", "mcp", "mcp-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/tidybytetools/base64-lite"
Documentation = "https://github.com/tidybytetools/base64-lite#readme"
Source = "https://github.com/tidybytetools/base64-lite"
Issues = "https://github.com/tidybytetools/base64-lite/issues"
Changelog = "https://github.com/tidybytetools/base64-lite/blob/main/CHANGELOG.md"
Apify = "https://apify.com/tidybytetools/base64-encode-decode"

[project.scripts]
base64-lite = "base64_lite:main"
base64-lite-mcp = "base64_lite_mcp:main"

[tool.setuptools]
py-modules = ["base64_lite", "base64_lite_mcp"]
